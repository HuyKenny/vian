name: audit
# Manual speed + SEO audit: builds the site from the saved state (no feed download, NO deploy), serves it with the real
# _headers rules and runs Lighthouse (mobile + desktop) on key pages plus the SEO lint. Everything runs on the GitHub runner.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VIAN_ENV: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Restore state (encrypted)
        run: scripts/state.sh pull
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - name: Blog feature photos (Pexels CDN)
        run: python3 scripts/blog_photos.py
      - name: Build site
        timeout-minutes: 30
        run: python3 scripts/build.py
      - name: SEO lint
        continue-on-error: true
        run: mkdir -p /tmp/audit && python3 scripts/seo_lint.py dist /tmp/audit/seo-report.json
      - name: Pages check with real headers (CSP violations, horizontal scroll)
        continue-on-error: true
        run: |
          npm i --no-save --silent puppeteer-core@23.11.1 >/dev/null
          (node scripts/serve.mjs 8765 >/dev/null 2>&1 &)
          sleep 2
          CHROME_PATH=$(command -v google-chrome || command -v chromium) node scripts/check_pages.mjs http://localhost:8765 /tmp/audit/shots | tee /tmp/audit/pages-check.txt
          pkill -f "scripts/serve.mjs" || true
      - name: Lighthouse (mobile + desktop)
        continue-on-error: true
        run: |
          (node scripts/serve.mjs 8765 >/dev/null 2>&1 &)
          sleep 2
          PROD=$(grep -o '<loc>[^<]*' dist/sitemap-products-1.xml | sed 's/<loc>https:\/\/vian.cz//' | sed -n '1p;40p')
          for u in / /rohove-sedacky/ /postele/ /obyvaci-pokoj/ $PROD; do
            n=$(echo "$u" | tr -c 'a-z0-9' '_' | cut -c1-40)
            for mode in mobile desktop; do
              extra=""; [ "$mode" = desktop ] && extra="--preset=desktop"
              npx --yes lighthouse@12.8.2 "http://localhost:8765$u" $extra --quiet --output=json --output-path="/tmp/audit/lh-$mode-$n.json" \
                --chrome-flags="--headless=new --no-sandbox --disable-gpu" --only-categories=performance,accessibility,best-practices,seo || true
            done
          done
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,glob
          print("### Lighthouse (local, real headers)\n\n| page | mode | perf | a11y | best | seo | LCP s | CLS | TBT ms | FCP s | KB |\n|---|---|---|---|---|---|---|---|---|---|---|")
          for f in sorted(glob.glob('/tmp/audit/lh-*.json')):
              d=json.load(open(f)); c=d['categories']; a=d['audits']
              g=lambda k:a[k]['numericValue']
              print(f"| {d['requestedUrl'].replace('http://localhost:8765','')} | {f.split('lh-')[1].split('-')[0]} | {round(c['performance']['score']*100)} | {round(c['accessibility']['score']*100)} | {round(c['best-practices']['score']*100)} | {round(c['seo']['score']*100)} | {g('largest-contentful-paint')/1000:.1f} | {g('cumulative-layout-shift'):.3f} | {g('total-blocking-time'):.0f} | {g('first-contentful-paint')/1000:.1f} | {g('total-byte-weight')/1024:.0f} |")
          print("\n### Failing audits (score < 0.9)\n")
          seen=set()
          for f in sorted(glob.glob('/tmp/audit/lh-mobile-*.json')):
              d=json.load(open(f))
              for k,v in d['audits'].items():
                  if v.get('score') is not None and v['score']<0.9 and v.get('scoreDisplayMode')=='numeric' and k not in seen:
                      seen.add(k); print(f"- **{k}** ({v['score']}): {v['title']} — {v.get('displayValue','')}")
          PY
          { echo '### Pages check (CSP / overflow)'; echo '```'; cat /tmp/audit/pages-check.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo '### SEO lint' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json;d=json.load(open('/tmp/audit/seo-report.json'));print({k:d[k] for k in ('pages','products','indexable','in_sitemap')});[print('HARD',k,v['count'],v['examples'][:3]) for k,v in d['hard'].items()];[print('soft',k,v['count'],v['examples'][:2]) for k,v in d['soft'].items()]" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: audit
          path: /tmp/audit
          retention-days: 7
          if-no-files-found: ignore
